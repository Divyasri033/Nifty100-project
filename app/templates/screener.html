{% extends "base.html" %}

{% block title %}Stock Screener – Nifty 100 Intelligence{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-6">Stock Screener</h1>
<p class="text-gray-600 mb-4">Find companies that match your financial criteria.</p>

<div class="bg-white rounded-lg shadow p-6 mb-6">
    <form id="screenerForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium mb-1">Sector</label>
            <select name="sector" class="w-full border rounded px-3 py-2">
                <option value="">All Sectors</option>
                {% for sector in sectors %}
                <option value="{{ sector }}">{{ sector }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Minimum Revenue (₹ Cr)</label>
            <input type="number" name="min_revenue" class="w-full border rounded px-3 py-2" step="1000" placeholder="e.g., 50000">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Maximum Debt to Equity</label>
            <input type="number" name="max_debt_to_equity" class="w-full border rounded px-3 py-2" step="0.1" placeholder="e.g., 2.0">
        </div>
        <div class="flex items-end">
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Apply Filters</button>
            <button type="button" id="resetBtn" class="ml-2 bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">Reset</button>
        </div>
    </form>
</div>

<div id="results" class="hidden">
    <h2 class="text-xl font-semibold mb-3">Results</h2>
    <div class="overflow-x-auto bg-white rounded-lg shadow">
        <table class="min-w-full">
            <thead class="bg-gray-200">
                <tr>
                    <th class="px-4 py-2">Symbol</th>
                    <th class="px-4 py-2">Company Name</th>
                    <th class="px-4 py-2">Sector</th>
                    <th class="px-4 py-2">Actions</th>
                </tr>
            </thead>
            <tbody id="screenerResults"></tbody>
        </table>
    </div>
</div>

<script>
    const form = document.getElementById('screenerForm');
    const resultsDiv = document.getElementById('results');
    const tbody = document.getElementById('screenerResults');
    const resetBtn = document.getElementById('resetBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const filters = {};
        if (formData.get('sector')) filters.sector = formData.get('sector');
        if (formData.get('min_revenue')) filters.min_revenue = parseFloat(formData.get('min_revenue'));
        if (formData.get('max_debt_to_equity')) filters.max_debt_to_equity = parseFloat(formData.get('max_debt_to_equity'));

        try {
            const response = await fetch('/api/public/screener', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(filters)
            });
            if (!response.ok) throw new Error('Network error');
            const companies = await response.json();
            if (companies.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4">No companies match your criteria.</td></tr>';
            } else {
                tbody.innerHTML = companies.map(c => `
                    <tr class="border-t hover:bg-gray-50">
                        <td class="px-4 py-2 font-mono">${c.symbol}</td>
                        <td class="px-4 py-2">${c.name || '-'}</td>
                        <td class="px-4 py-2">${c.sector || '-'}</td>
                        <td class="px-4 py-2"><a href="/company/${c.symbol}" class="text-blue-600 hover:underline">View</a></td>
                    </tr>
                `).join('');
            }
            resultsDiv.classList.remove('hidden');
        } catch (err) {
            console.error(err);
            alert('Failed to fetch screener results.');
        }
    });

    resetBtn.addEventListener('click', () => {
        form.reset();
        resultsDiv.classList.add('hidden');
    });
</script>
{% endblock %}
